      - name: Cache toolchain and runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/dev
            runtime/.cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: toolchain-${{ runner.os }}-${{ hashFiles('tooling/setup-toolchain.sh') }}
          restore-keys: |
            toolchain-${{ runner.os }}-

      # setup-toolchain.sh pulls the JDK from the Tsinghua mirror, which answers 403
      # now. actions/setup-java gives the same Temurin 17; the symlink makes the script
      # see it as already installed and skip its own download.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain (Flutter, Android SDK/NDK)
        run: |
          mkdir -p "$HOME/dev"
          ln -sfn "$JAVA_HOME" "$HOME/dev/jdk-17"
          test -x "$HOME/dev/jdk-17/bin/java"
          bash tooling/setup-toolchain.sh

      # gradlew is not committed in this repo, so Gradle comes from here (repo CI does
      # the same); the wrapper is generated below so `flutter build apk` finds it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Generates lib/l10n/app_*.arb + lib/l10n/gen and the guide skill assets:
      # `flutter analyze` below needs both, and neither is hand-editable.
      - name: Text generation (l10n, guide)
        run: |
          source tooling/env.sh
          python3 app/tool/l10n_merge.py
          python3 app/tool/guide_sync.py

      # Gradle reads runtime/out in the configuration phase, so this comes first.
      - name: Runtime package (arm64-v8a)
        env:
          # The committed deb lock pins filenames resolved against the old mirror
          # (e.g. ca-certificates_20260816ubuntu0.24.04.1, which ports.ubuntu.com no
          # longer publishes: it has .2 now) -> 404. Re-resolve against the signed
          # Packages.xz of the mirror actually used; every deb is still checked
          # against the hash that index lists.
          UPDATE_DEB_LOCK: 1
        run: |
          source tooling/env.sh
          # build-runtime.sh downloads the Ubuntu base rootfs and apt archives from a
          # Tsinghua mirror that answers 403 now. Point those three at the official
          # mirrors (same bytes: every file is checked against its pinned sha256, and
          # apt against the signed InRelease). Specific paths first, then the rest.
          sed -i -e 's#^UBUNTU_MIRROR=.*#UBUNTU_MIRROR="https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release"#' -e 's#^UBUNTU_ARCHIVE_AMD64=.*#UBUNTU_ARCHIVE_AMD64="https://archive.ubuntu.com/ubuntu"#' -e 's#^UBUNTU_ARCHIVE_ARM64=.*#UBUNTU_ARCHIVE_ARM64="https://ports.ubuntu.com/ubuntu-ports"#' runtime/build-runtime.sh
          grep -n '^UBUNTU_' runtime/build-runtime.sh
          # Termux moved proot 5.1.107.98 -> 5.1.107.102; the old .deb is gone from both
          # the index and the pool, so the pinned version would 404. The new deb keeps
          # the same two payload paths and is the one the index lists.
          sed -i -e 's#^PROOT_VERSION=".*"#PROOT_VERSION="5.1.107.102"#' -e 's#\[proot_5\.1\.107\.98_aarch64\.deb\]=.*#[proot_5.1.107.102_aarch64.deb]=10a394b585c2fc2b2c8502544f4e5f1be581dc8bfff79e8ba62f16207423e030#' -e 's#\[proot-v5\.1\.107\.98\.zip\]=.*#[proot-v5.1.107.102.zip]=30d12a6e2cc4147123756ff58edea262d3083bbc238c12d0ab9b39e3d1c40852#' runtime/build-runtime.sh
          grep -n 'proot' runtime/build-runtime.sh | head -6
          bash runtime/build-runtime.sh arm64-v8a

      - name: Analyze and Kotlin unit tests
        run: |
          source tooling/env.sh
          # tooling/env.sh points pub at the cn mirror, but app/pubspec.lock pins every
          # package to pub.dev. A mismatched host makes pub try to "update" the whole
          # lockfile and crash (Failed to update packages / exit 75). The repo's own CI
          # likewise leaves the app job on pub.dev.
          export PUB_HOSTED_URL="https://pub.dev"
          cd app
          flutter pub get --enforce-lockfile
          flutter analyze
          # gradlew is not in git, and both `gradle wrapper` and `flutter build` need
          # android/local.properties first (repo CI writes it the same way).
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$HOME/dev/flutter" > android/local.properties
          (cd android && gradle wrapper --gradle-version 9.3.1 --distribution-type bin && test -x gradlew)
          flutter build apk --config-only --flavor arm64 --target-platform android-arm64
          # Only the arm64 flavor is configured above; the unflavored test task would
          # pull in x64, whose runtime bundle this job does not build.
          cd android && gradle --stacktrace :app:testArm64DebugUnitTest

      - name: APK (arm64, side-by-side .dev)
        run: |
          source tooling/env.sh
          # Same reason as the step above: flutter build runs pub again.
          export PUB_HOSTED_URL="https://pub.dev"
          name=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          code=$(python3 tooling/build_number.py)
          echo "Building $name ($code) as applicationId .dev"
          bash tooling/build-apk.sh -f arm64 --build-name "$name" -n "$code"
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk dsh-go-root-arm64.apk
          ls -lh dsh-go-root-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-arm64
          path: dsh-go-root-arm64.apk
          if-no-files-found: error
