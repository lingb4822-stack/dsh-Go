# Builds a DSH Go APK with the root tool (`mcp__phone__root`), signed with the
# debug key and installed side by side with the official app (applicationId .dev).
#
# The changes are embedded below as a base64 patch, so this one file is all the
# fork needs. Everything else — toolchain, runtime bundle, l10n generation — is
# the repository's own tooling.
#
# Run: Actions → build-root-apk → Run workflow. Download the artifact when done.

name: build-root-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # No emulator, no system image: install cmake instead of the default x86_64
      # image and save the 2 GB download.
      SYSTEM_IMAGE: cmake;3.22.1
      DSH_BETA_TOKEN_FILE: ''
      # The repo's Aliyun Maven mirrors are slow or broken from a US runner.
      DSH_MAVEN_MIRRORS: 0
      # Side-by-side install next to the official 1.x app (different applicationId).
      DSH_APP_ID_SUFFIX: .dev
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    steps:
      - uses: actions/checkout@v4

      - name: Apply the root patch
        run: |
          set -euo pipefail
